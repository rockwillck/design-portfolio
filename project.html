<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<title>Project</title>
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<link rel="stylesheet" type="text/css" href="style.css" />
	<link rel="icon" href="download.png">
	<style>
		.project-page {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			min-height: 100vh;
			background-color: #000;
			padding: 40px 20px;
			box-sizing: border-box;
			color: white;
			font-family: plain;
		}

		.project-container {
			max-width: 1400px;
			margin: 0 auto;
		}

		.project-header {
			margin-bottom: 50px;
		}

		.project-header a {
			color: #aaa;
			text-decoration: none;
			font-size: 14px;
			margin-bottom: 20px;
			display: inline-block;
		}

		.project-header a:hover {
			color: white;
		}

		.project-header h1 {
			font-size: 48px;
			margin: 0;
			color: white;
			mix-blend-mode: normal;
			font-family: plain;
			text-transform: uppercase;
		}

		/* Main Content Layout */
		.project-main-content {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 40px;
			margin-bottom: 60px;
			align-items: start;
		}

		@media (max-width: 1024px) {
			.project-main-content {
				grid-template-columns: 1fr;
			}
		}

		/* 3D Viewer Section */
		.step-viewer-section {
			background-color: #111;
			border-radius: 10px;
			overflow: hidden;
			height: 500px;
			border: 1px solid #333;
		}

		.step-viewer-section iframe {
			width: 100%;
			height: 100%;
			border: none;
		}

		/* Specifications Section */
		.specifications-section {
			background-color: #111;
			border: 1px solid #333;
			border-radius: 10px;
			padding: 30px;
			height: 500px;
			display: flex;
			flex-direction: column;
		}

		.specifications-section h2 {
			font-size: 24px;
			margin: 0 0 20px 0;
			text-transform: uppercase;
			letter-spacing: 1px;
		}

		.specs-content {
			flex: 1;
			overflow-y: auto;
			font-size: 14px;
			line-height: 1.6;
			color: #ccc;
		}

		.specs-content p {
			margin: 0 0 15px 0;
		}

		.spec-item {
			margin-bottom: 15px;
		}

		.spec-label {
			font-weight: bold;
			color: white;
			margin-bottom: 5px;
		}

		.spec-value {
			color: #aaa;
			padding-left: 10px;
		}

		/* Image Carousel Section */
		.carousel-section {
			width: 100%;
		}

		.carousel-section h2 {
			font-size: 24px;
			margin: 0 0 20px 0;
			text-transform: uppercase;
			letter-spacing: 1px;
		}

		.carousel-container {
			position: relative;
			background-color: #111;
			border: 1px solid #333;
			border-radius: 10px;
			padding: 20px;
			overflow: hidden;
		}

		.carousel-wrapper {
			position: relative;
			overflow: hidden;
		}

		.carousel-track {
			display: flex;
			gap: 15px;
			transition: transform 0.5s ease;
		}

		.carousel-item {
			flex: 0 0 calc(33.333% - 10px);
			border-radius: 8px;
			overflow: hidden;
			background-color: #222;
			height: 250px;
			cursor: pointer;
			transition: transform 0.3s ease;
		}

		.carousel-item:hover {
			transform: scale(1.03);
		}

		.carousel-item img {
			width: 100%;
			height: 100%;
			object-fit: cover;
		}

		.carousel-placeholder {
			display: flex;
			align-items: center;
			justify-content: center;
			width: 100%;
			height: 100%;
			background: linear-gradient(135deg, #444, #222);
			color: #888;
			font-size: 12px;
			text-align: center;
		}

		/* Navigation Arrows */
		.carousel-nav {
			position: absolute;
			top: 50%;
			transform: translateY(-50%);
			width: 40px;
			height: 40px;
			background-color: rgba(255, 255, 255, 0.15);
			border: none;
			color: white;
			font-size: 20px;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			border-radius: 50%;
			transition: all 0.3s ease;
			z-index: 10;
		}

		.carousel-nav:hover {
			background-color: rgba(255, 255, 255, 0.3);
		}

		.carousel-nav.disabled {
			opacity: 0;
			cursor: not-allowed;
			pointer-events: none;
		}

		.carousel-nav.prev {
			left: 10px;
		}

		.carousel-nav.next {
			right: 10px;
		}

		.token-setup {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100vh;
			background: rgba(0, 0, 0, 0.9);
			display: flex;
			align-items: center;
			justify-content: center;
			z-index: 1000;
		}

		.token-setup-content {
			background: #222;
			padding: 40px;
			border-radius: 10px;
			max-width: 500px;
			text-align: center;
		}

		.token-setup-content h2 {
			margin-top: 0;
			margin-bottom: 20px;
		}

		.token-setup-content input {
			width: 100%;
			padding: 10px;
			margin-bottom: 15px;
			border: 1px solid #555;
			border-radius: 5px;
			background: #333;
			color: white;
			box-sizing: border-box;
			font-family: plain;
		}

		.token-setup-content button {
			background: white;
			color: black;
			border: none;
			padding: 12px 30px;
			border-radius: 5px;
			cursor: pointer;
			font-family: plain;
			font-weight: bold;
		}

		.token-setup-content button:hover {
			background: #ddd;
		}

		.status-message {
			padding: 15px;
			margin-bottom: 20px;
			border-radius: 5px;
			display: none;
		}

		.status-message.success {
			background: #2d5016;
			color: #90ee90;
		}

		.status-message.error {
			background: #5c2623;
			color: #ff6b6b;
		}
	</style>
</head>

<body>
	<div class="token-setup" id="tokenSetup" style="display: none;">
		<div class="token-setup-content">
			<h2>GitHub Token Required</h2>
			<p>To save photos permanently, you need to add your GitHub Personal Access Token.</p>
			<div class="status-message" id="tokenStatus"></div>
			<input type="password" id="tokenInput" placeholder="Enter your GitHub token (read/write repo access)" />
			<button onclick="saveToken()">Save Token</button>
			<p style="font-size: 12px; color: #aaa; margin-top: 20px;">
				<a href="https://github.com/settings/tokens" target="_blank" style="color: #aaa;">Create a token here</a>
			</p>
		</div>
	</div>

	<div class="project-page">
		<div class="project-container">
			<div class="project-header">
				<a href="/">← Back to Portfolio</a>
				<h1 id="projectTitle">Project Title</h1>
			</div>

			<!-- Main Content: 3D Viewer + Specifications -->
			<div class="project-main-content">
				<!-- STEP File Viewer -->
				<div class="step-viewer-section">
					<iframe id="stepViewerFrame" src="viewer.html" allow="fullscreen" allowtransparency="true"></iframe>
				</div>

				<!-- Specifications -->
				<div class="specifications-section">
					<h2>Specifications</h2>
					<div class="specs-content" id="specsContent">
						<p>No specifications available for this project.</p>
					</div>
				</div>
			</div>

			<!-- Image Carousel -->
			<div class="carousel-section">
				<h2>Project Gallery</h2>
				<div class="carousel-container">
					<button class="carousel-nav prev" id="prevBtn" onclick="scrollCarousel(-1)">❮</button>
					<div class="carousel-wrapper">
						<div class="carousel-track" id="carouselTrack"></div>
					</div>
					<button class="carousel-nav next" id="nextBtn" onclick="scrollCarousel(1)">❯</button>
				</div>
			</div>
		</div>
	</div>

	<script src="projects.js"></script>
	<script>
		let currentProject = null;
		let carouselPosition = 0;
		const itemsPerView = 3;
		const itemWidth = 33.333; // percentage

		// Load project data on page load
		document.addEventListener('DOMContentLoaded', () => {
			const urlParams = new URLSearchParams(window.location.search);
			const projectId = urlParams.get('id');
			loadProjectPage(projectId);

			// Check if token is needed
			const token = getGitHubToken();
			if (!token) {
				document.getElementById('tokenSetup').style.display = 'flex';
			}
		});

		function saveToken() {
			const input = document.getElementById('tokenInput');
			const token = input.value.trim();
			const statusEl = document.getElementById('tokenStatus');

			if (!token) {
				showStatus(statusEl, 'Please enter a token', 'error');
				return;
			}

			// Save token
			setGitHubToken(token);
			showStatus(statusEl, 'Token saved! Refreshing...', 'success');
			
			setTimeout(() => {
				document.getElementById('tokenSetup').style.display = 'none';
			}, 1000);
		}

		function showStatus(element, message, type) {
			element.textContent = message;
			element.className = 'status-message ' + type;
			element.style.display = 'block';
		}

		function loadProjectPage(projectId) {
			const project = projects.find(p => p.id === projectId);

			if (!project) {
				document.getElementById('projectTitle').textContent = 'Project Not Found';
				return;
			}

			currentProject = project;

			// Set project title
			document.getElementById('projectTitle').textContent = project.title;
			document.title = project.title + ' - Gabriella Shepherd';

			// Load STEP file if it exists
			if (project.stepFile) {
				const frame = document.getElementById('stepViewerFrame');
				frame.onload = () => {
					if (frame.contentWindow.loadDefaultSample) {
						frame.contentWindow.loadDefaultSample = () => {
							frame.contentWindow.loadStepFromFile(project.stepFile);
						};
					}
				};
			}

			// Load specifications (placeholder - can be customized per project)
			loadSpecifications(project);

			// Load carousel
			loadCarousel(project);
		}

		function loadSpecifications(project) {
			const specsContent = document.getElementById('specsContent');
			
			// Placeholder specifications - can be customized per project
			const specs = {
				'project-1': `
					<div class="spec-item">
						<div class="spec-label">Material:</div>
						<div class="spec-value">Alloy Steel</div>
					</div>
					<div class="spec-item">
						<div class="spec-label">Dimensions:</div>
						<div class="spec-value">200mm × 150mm × 75mm</div>
					</div>
					<div class="spec-item">
						<div class="spec-label">Weight:</div>
						<div class="spec-value">2.5 kg</div>
					</div>
					<div class="spec-item">
						<div class="spec-label">Process:</div>
						<div class="spec-value">CNC Machining, Manual Mill</div>
					</div>
					<div class="spec-item">
						<div class="spec-label">Tolerances:</div>
						<div class="spec-value">±0.5mm</div>
					</div>
				`,
				'project-2': `
					<div class="spec-item">
						<div class="spec-label">Welding Type:</div>
						<div class="spec-value">TIG (Tungsten Inert Gas)</div>
					</div>
					<div class="spec-item">
						<div class="spec-label">Material:</div>
						<div class="spec-value">Mild Steel, Stainless Steel</div>
					</div>
					<div class="spec-item">
						<div class="spec-label">Joint Design:</div>
						<div class="spec-value">Butt Joint, Fillet Joint</div>
					</div>
					<div class="spec-item">
						<div class="spec-label">Amperage:</div>
						<div class="spec-value">50-200A DC</div>
					</div>
					<div class="spec-item">
						<div class="spec-label">Quality Standard:</div>
						<div class="spec-value">AWS D1.1</div>
					</div>
				`,
				'project-3': `
					<div class="spec-item">
						<div class="spec-label">Application:</div>
						<div class="spec-value">Vehicle Suspension</div>
					</div>
					<div class="spec-item">
						<div class="spec-label">Material:</div>
						<div class="spec-value">High-Strength Steel</div>
					</div>
					<div class="spec-item">
						<div class="spec-label">Design Pressure:</div>
						<div class="spec-value">50 kN per point</div>
					</div>
					<div class="spec-item">
						<div class="spec-label">Analysis Method:</div>
						<div class="spec-value">FEA (ANSYS Mechanical)</div>
					</div>
					<div class="spec-item">
						<div class="spec-label">Safety Factor:</div>
						<div class="spec-value">2.5</div>
					</div>
				`
			};

			specsContent.innerHTML = specs[project.id] || '<p>No specifications available for this project.</p>';
		}

		function loadCarousel(project) {
			const track = document.getElementById('carouselTrack');
			track.innerHTML = '';
			carouselPosition = 0;

			if (!project.photos || project.photos.length === 0) {
				// Show placeholder
				const item = document.createElement('div');
				item.className = 'carousel-item';
				item.innerHTML = '<div class="carousel-placeholder">No photos available</div>';
				track.appendChild(item);
				updateCarouselNavigation(project);
				return;
			}

			// Add photo items
			project.photos.forEach(photo => {
				const item = document.createElement('div');
				item.className = 'carousel-item';
				item.innerHTML = `<img src="${photo}" alt="Project photo">`;
				track.appendChild(item);
			});

			updateCarouselNavigation(project);
		}

		function scrollCarousel(direction) {
			if (!currentProject || !currentProject.photos) return;

			const track = document.getElementById('carouselTrack');
			const totalItems = currentProject.photos.length;
			const maxPosition = Math.max(0, totalItems - itemsPerView);

			carouselPosition += direction;
			carouselPosition = Math.max(0, Math.min(carouselPosition, maxPosition));

			const offset = carouselPosition * (itemWidth + 0.45); // 0.45 is gap percentage
			track.style.transform = `translateX(-${offset}%)`;

			updateCarouselNavigation(currentProject);
		}

		function updateCarouselNavigation(project) {
			const prevBtn = document.getElementById('prevBtn');
			const nextBtn = document.getElementById('nextBtn');
			const totalItems = project.photos ? project.photos.length : 0;
			const maxPosition = Math.max(0, totalItems - itemsPerView);

			// Hide navigation if 3 or fewer items
			if (totalItems <= itemsPerView) {
				prevBtn.classList.add('disabled');
				nextBtn.classList.add('disabled');
			} else {
				prevBtn.classList.toggle('disabled', carouselPosition === 0);
				nextBtn.classList.toggle('disabled', carouselPosition === maxPosition);
			}
		}
	</script>
</body>

</html>
